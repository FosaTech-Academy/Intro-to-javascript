<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <title>Document</title>
  </head>
  <body>
    <!-- Register form -->
    <div class="container pt-5">
      <section class="registerSection">
        <h5>Create an Account</h5>

        <form class="registerForm" action="post">
          <div id="register-message"></div>
          <div class="form-group">
            <label for="exampleInputEmail1">Full name</label>
            <input
              type="text"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter full name"
              name="fullName"
            />
            <small id="emailHelp" class="form-text text-muted"
              >We'll never share your email with anyone else.</small
            >
          </div>
          <div class="form-group">
            <label for="exampleInputEmail1">Email address</label>
            <input
              type="email"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter email"
              name="email"
            />
            <small id="emailHelp" class="form-text text-muted"
              >We'll never share your email with anyone else.</small
            >
          </div>
          <div class="form-group">
            <label for="exampleInputPassword1">Password</label>
            <input
              type="password"
              class="form-control"
              id="exampleInputPassword1"
              placeholder="Password"
              name="password"
            />
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <div>
          Already have an account? <a id="login-link" href="#">Login</a>
        </div>
      </section>
    </div>

    <!-- Login form -->
    <div class="container pt-5">
      <section class="loginSection">
        <h5>Login to continue</h5>
        <form class="loginForm" action="post">
          <div id="login-message"></div>
          <div class="form-group">
            <label for="exampleInputEmail1">Email address</label>
            <input
              type="email"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
              placeholder="Enter email"
              name="email"
            />
            <small id="emailHelp" class="form-text text-muted"
              >We'll never share your email with anyone else.</small
            >
          </div>
          <div class="form-group">
            <label for="exampleInputPassword1">Password</label>
            <input
              type="password"
              class="form-control"
              id="exampleInputPassword1"
              placeholder="Password"
              name="password"
            />
          </div>
          <button id="loginBtn" type="submit" class="btn btn-primary">
            Submit
          </button>
        </form>
      </section>
    </div>

    <!-- Dashboad -->
    <div class="container pb-5">
      <section class="dashboard">
        <h3>Dashboard</h3>
        <div id="welcome-message"></div>
        <h5>Users</h5>

        <table class="table table-hover">
          <thead>
            <tr>
              <th scope="col">Id</th>
              <th scope="col">Full name</th>
              <th scope="col">Email</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <!-- Users will be populated here -->
          </tbody>
        </table>
        <button id="logoutBtn" type="button" class="btn btn-danger">
          Logout
        </button>
      </section>
    </div>

    <script src="helpers.js"></script>
    <script src="index.js"></script>
  </body>
</html>
