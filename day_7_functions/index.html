<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
  </head>
  <body>
    <h1>Profile</h1>
    <div>
      <h3>Create an account</h3>
      <form method="post">
        <label>First Name</label>
        <input type="text" />
        <br />
        <label>Last Name</label>
        <input type="text" />
        <br />
        <label>Email</label>
        <input type="email" />
        <br />
        <label>Password</label>
        <input type="password" />
        <br />
        <button type="submit">Submit</button>
      </form>
    </div>
    <div>
      <h3>Sign in to continue</h3>
      <form>
        <label>Username</label>
        <input type="text" />
        <br />
        <label>Password</label>
        <input type="password" />
        <br />
        <button type="submit">Submit</button>
      </form>
    </div>

    <script src="login.js"></script>
  </body>
</html>
